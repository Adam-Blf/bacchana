name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilege. Sans ce bloc, le jeton herite du defaut de
# l'organisation, qui est souvent en ecriture. Aucun job de ce workflow
# n'a besoin d'ecrire quoi que ce soit.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Actions epinglees sur l'empreinte de commit, pas sur le tag.
      # Un tag est mutable : son mainteneur peut le republier sur un autre
      # commit, et l'action recevrait alors les secrets du job. L'empreinte
      # ne bouge pas. Dependabot proposera les montees de version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # .npmrc versionne porte ignore-scripts=true : aucun script de cycle de
        # vie d'une dependance ne s'execute. Parade a l'attaque ChainDrop du
        # 4 aout 2026, voir les commentaires du .npmrc.
        run: npm ci

      - name: Supply chain guard (ChainDrop, npm 2026-08-04)
        run: npm run check:supply-chain

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Contrast check (WCAG 2.1, tokens.css)
        run: npm run check:contrast

      - name: Alcohol lexicon guard (Apple guideline 1.4.3)
        run: npm run check:alcohol

      - name: Tile ink guard (no theme ink on a theme-invariant light flat)
        run: npm run check:tile-ink

      # Ajoutee le 2026-09-14. Deux declarations CSS fautives par leur forme :
      # `overflow-x: clip` sur `html` ou `body`, une coupe redondante avec
      # celle du cadre de transition et qui interdit le defilement de la
      # racine, et un rayon de 0.5px dans le grain plein ecran, qui n'a pas de
      # trame exacte en DPR 3. Aucune mesure sur navigateur pilote ne les
      # reproduit, d'ou une garde sur la FORME et non sur le rendu.
      - name: Defilement guard (no Y clip at the document root, no half-pixel pattern)
        run: npm run check:defilement

      # Passee en CI le 2026-09-14, avec le depart d'Icons8. Elle etait hors CI
      # tant qu'elle ne verifiait qu'une liste de fichiers ; elle refuse
      # desormais un orphelin, un fill="none" (que le masque rendrait en carre
      # plein) et un poids en desaccord avec le script de rapatriement - trois
      # defauts qui ne se voient qu'a l'ecran.
      - name: Icons guard (complete, local, maskable, weights as declared)
        run: npm run check:icons

      # Ajoutee le 2026-08-31, apres avoir trouve un dossier incubateur complet
      # - budget previsionnel compris - publiquement lisible sur une branche
      # oubliee, le jour meme ou le depot est passe en public. Un scan de
      # secrets ne pouvait pas le voir : il cherchait des cles, pas des
      # documents qu'on ne voulait pas publier.
      - name: Aucun document confidentiel suivi
        run: npm run check:confidentiel

      - name: Build
        run: npm run build

      # Apres le build, et c'est la seule facon de la faire tourner : elle lit
      # ce que le build a reellement produit, pas ce que le code a l'air de dire.
      - name: Entry chunk guard (no game content before first paint)
        run: npm run check:entree

      - name: Typography guard (no em dash, en dash, middle dot)
        run: |
          if grep -rnP "\x{2014}|\x{2013}|\x{00B7}" README.md CHANGELOG.md .github/workflows 2>/dev/null; then
            echo "Forbidden typography found" && exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action appelle ScanPullRequest, qui lit l API des PR. Le bloc
    # permissions au niveau workflow retire le scope implicite pull-requests,
    # et l action meurt alors en 403 avant meme de scanner. On rend le droit
    # ici, sur le seul job qui en a besoin, plutot que d elargir le workflow.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
