name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Contrast check (WCAG 2.1, tokens.css)
        run: npm run check:contrast

      - name: Alcohol lexicon guard (Apple guideline 1.4.3)
        run: npm run check:alcohol

      - name: Build
        run: npm run build

      - name: Typography guard (no em dash, en dash, middle dot)
        run: |
          if grep -rnP "\x{2014}|\x{2013}|\x{00B7}" README.md CHANGELOG.md 2>/dev/null; then
            echo "Forbidden typography found" && exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
