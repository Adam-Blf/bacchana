name: Sync repo topics

# Quand on modifie .github/topics.yml et qu'on pousse, le workflow remplace
# l'ensemble des topics du depot via l'API GitHub. Idempotent, il ne fait
# rien si la liste est deja a jour.
#
# Ce workflow necessite un jeton d'acces personnel avec la portee
# `public_repo` (ou `repo` pour les depots prives) stocke dans le secret
# `TOPICS_PAT`. Le jeton natif GITHUB_TOKEN ne peut pas modifier les topics,
# c'est une limite de GitHub Actions, pas un defaut du workflow.
#
# Mise en place, une seule fois :
#   1. github.com, Settings, Developer settings, jeton classique,
#      generer avec la portee `public_repo` et `repo` si depots prives
#   2. dans CHAQUE depot cible : Settings, Secrets, Actions,
#      New repository secret, nom `TOPICS_PAT`, valeur egale au jeton
#   3. ou en lot via gh :
#      gh secret set TOPICS_PAT --repos Adam-Blf/repo1,Adam-Blf/repo2
#
# Si le secret n'est pas defini, le workflow se termine en succes avec un
# message d'omission plutot que de polluer l'onglet Actions de runs rouges.

on:
  push:
    branches: [main, master]
    paths:
      - ".github/topics.yml"
  workflow_dispatch:

# Moindre privilege. La modification des topics passe par TOPICS_PAT, pas
# par le jeton natif, qui n'a donc besoin que de la lecture du code.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Empreinte de commit et non tag mutable, voir le commentaire de ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secret presence
        id: secret
        env:
          TOPICS_PAT: ${{ secrets.TOPICS_PAT }}
        run: |
          if [ -z "${TOPICS_PAT:-}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::secrets.TOPICS_PAT not set, skipping, see workflow comments"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read topics from .github/topics.yml
        if: steps.secret.outputs.missing == 'false'
        id: topics
        run: |
          set -euo pipefail
          if [ ! -f .github/topics.yml ]; then
            echo "::warning::no .github/topics.yml, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NAMES=$(awk '
            /^topics:/ { in_list=1; next }
            in_list && /^[[:space:]]*-/ {
              gsub(/^[[:space:]]*-[[:space:]]*/, "", $0);
              gsub(/[[:space:]]*#.*$/, "", $0);
              if ($0 != "") print $0
            }
            in_list && /^[^[:space:]-]/ { in_list=0 }
          ' .github/topics.yml | jq -R . | jq -s -c .)
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"
          echo "Found topics: $NAMES"

      - name: PUT topics via GitHub API
        if: steps.secret.outputs.missing == 'false' && steps.topics.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.TOPICS_PAT }}
          REPO: ${{ github.repository }}
          NAMES: ${{ steps.topics.outputs.names }}
        run: |
          set -euo pipefail
          BODY=$(jq -n --argjson names "$NAMES" '{names: $names}')
          echo "PUT /repos/$REPO/topics with $BODY"
          echo "$BODY" | gh api \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPO/topics" \
            --input -
