<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 352" preserveAspectRatio="xMidYMid slice">
  <!-- Meskova - dos de carte néobrutaliste : rayures diagonales, badge étoile, encre épaisse. -->
  <defs>
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#FFF9F0"/>
      <rect width="14" height="28" fill="#FF5C00"/>
    </pattern>
  </defs>

  <rect width="252" height="352" fill="#FFF9F0"/>
  <rect x="10" y="10" width="232" height="332" rx="14" fill="url(#stripes)" stroke="#111111" stroke-width="6"/>
  <rect x="26" y="26" width="200" height="300" rx="10" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- Badge central -->
  <circle cx="130" cy="180" r="62" fill="#111111"/>
  <circle cx="126" cy="176" r="62" fill="#FFD029" stroke="#111111" stroke-width="6"/>
  <path d="M126 128 L138 160 L172 164 L146 186 L154 220 L126 200 L98 220 L106 186 L80 164 L114 160 Z"
        fill="#FF5C00" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- Coins -->
  <circle cx="44" cy="48" r="8" fill="#FF6FB2" stroke="#111111" stroke-width="4"/>
  <circle cx="208" cy="48" r="8" fill="#2F6BFF" stroke="#111111" stroke-width="4"/>
  <circle cx="44" cy="304" r="8" fill="#2F6BFF" stroke="#111111" stroke-width="4"/>
  <circle cx="208" cy="304" r="8" fill="#FF6FB2" stroke="#111111" stroke-width="4"/>
</svg>
