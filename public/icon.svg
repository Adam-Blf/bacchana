<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- La Taverne - logo néobrutaliste : deux verres qui trinquent, ombres dures, encre épaisse. -->
  <rect width="512" height="512" fill="#FFF9F0"/>

  <!-- Éclat du "tchin" -->
  <path d="M256 74 L272 130 L328 146 L272 162 L256 218 L240 162 L184 146 L240 130 Z"
        fill="#FFD029" stroke="#111111" stroke-width="12" stroke-linejoin="round"/>

  <!-- Verre gauche (orange), incliné vers la droite -->
  <g transform="rotate(-14 190 300)">
    <rect x="160" y="236" width="108" height="164" rx="16" fill="#111111"/>
    <rect x="146" y="222" width="108" height="164" rx="16" fill="#FF5C00" stroke="#111111" stroke-width="12"/>
    <rect x="146" y="222" width="108" height="42" rx="16" fill="#FFF9F0" stroke="#111111" stroke-width="12"/>
    <circle cx="180" cy="310" r="9" fill="#FFF9F0"/>
    <circle cx="214" cy="342" r="7" fill="#FFF9F0"/>
  </g>

  <!-- Verre droit (jaune), incliné vers la gauche -->
  <g transform="rotate(14 322 300)">
    <rect x="282" y="236" width="108" height="164" rx="16" fill="#111111"/>
    <rect x="268" y="222" width="108" height="164" rx="16" fill="#FFD029" stroke="#111111" stroke-width="12"/>
    <rect x="268" y="222" width="108" height="42" rx="16" fill="#FFF9F0" stroke="#111111" stroke-width="12"/>
    <circle cx="306" cy="312" r="9" fill="#FFF9F0"/>
    <circle cx="338" cy="344" r="7" fill="#FFF9F0"/>
  </g>

  <!-- Petites étincelles -->
  <circle cx="150" cy="130" r="12" fill="#FF6FB2" stroke="#111111" stroke-width="8"/>
  <circle cx="366" cy="122" r="12" fill="#2F6BFF" stroke="#111111" stroke-width="8"/>
</svg>
