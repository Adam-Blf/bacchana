<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Bacchus, declinaison monochrome. Exigence Android pour l'icone themee. -->
  
  <!-- Sarment : relie la feuille au sommet de la grappe -->
  <path d="M232 176 C 236 148, 226 128, 206 118"
        fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <!-- Vrille, une seule boucle : deux boucles deviennent du bruit a petite taille -->
  <path d="M300 190 C 316 166, 344 168, 348 190 C 350 206, 330 210, 328 196"
        fill="none" stroke="#111111" stroke-width="12"
        stroke-linecap="round"/>
  <!-- Feuille, cinq lobes et nervures -->
  <g transform="translate(196 118)">
    <path d="M0 0 C -14 -26, -44 -34, -62 -26 C -54 -44, -60 -70, -46 -82 C -28 -80, -16 -66, -10 -50 C -6 -74, 6 -96, 26 -104 C 40 -92, 44 -70, 38 -50 C 52 -62, 76 -66, 90 -56 C 88 -36, 72 -20, 52 -16 C 70 -10, 82 6, 80 24 C 62 32, 40 26, 26 12 Z" fill="#111111" transform="translate(10 10)"/>
    <path d="M0 0 C -14 -26, -44 -34, -62 -26 C -54 -44, -60 -70, -46 -82 C -28 -80, -16 -66, -10 -50 C -6 -74, 6 -96, 26 -104 C 40 -92, 44 -70, 38 -50 C 52 -62, 76 -66, 90 -56 C 88 -36, 72 -20, 52 -16 C 70 -10, 82 6, 80 24 C 62 32, 40 26, 26 12 Z" fill="none" stroke="#111111" stroke-width="14"
          stroke-linejoin="round"/>
    <path d="M0 0 L -40 -60  M0 0 L 6 -78  M0 0 L 54 -44  M0 0 L 52 6" fill="none" stroke="#111111" stroke-width="7"
          stroke-linecap="round"/>
